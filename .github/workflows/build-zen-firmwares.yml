name: Build Zen Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - 'zen/main'
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
      - name: Verify offline preset snapshot and generator
        run: |
          python3 tools/zen_radio_presets.py --check
          python3 -B -m unittest discover -s test -p 'test_zen_radio_presets.py'
      - name: Verify MeshCore boundary
        run: python3 tools/check_zen_baseline.py
      - name: Verify pinned transport extensions reject drift
        run: python3 -B -m unittest discover -s test -p 'test_zen_baseline_extensions.py'
      - name: Run native tests
        run: pio test -e native -e native_kiss_modem -e native_trace_transport

      - name: Build standard Wio companion boundary
        run: pio run -e WioTrackerL1_companion_radio_ble

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: WioTrackerL1_Zen_OLED
            device: WioTrackerL1_Zen_OLED
          - env: WioTrackerL1_Zen_E-INK
            device: WioTrackerL1_Zen_E-INK
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Resolve build version
        run: |
          SOURCE_VERSION=$(python3 tools/zen_version.py)
          if [ -z "$SOURCE_VERSION" ]; then
            echo "Unable to read Zen version from MyMesh.h"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$SOURCE_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match $SOURCE_VERSION"
            exit 1
          fi
          echo "BUILD_VERSION=${SOURCE_VERSION}" >> $GITHUB_ENV

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.BUILD_VERSION }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.env }}

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-firmware
          path: out

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:

      - name: Extract Version from Git Tag
        run: echo "GIT_TAG_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Download all Zen firmwares
        uses: actions/download-artifact@v4
        with:
          pattern: WioTrackerL1_Zen_*-firmware
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Zen ${{ env.GIT_TAG_VERSION }}
          body: ""
          draft: true
          files: |
            out/*.uf2
            out/*.zip
