; Zen is an overlay on the unmodified MeshCore Wio Tracker L1 targets.
; Extended headers are resolved before the baseline tree and every replaced
; implementation is compiled from examples/companion_radio/zen-overlay.

[zen_wio_overlay]
build_unflags = -Ofast
build_flags =
  -I examples/companion_radio/zen-overlay/src
  -I examples/companion_radio/zen-overlay/variants/wio-tracker-l1
  -I examples/companion_radio/zen-overlay/app
  -I examples/companion_radio/zen-overlay/app/ui-new
  -I examples/companion_radio
  -D FIRMWARE_ZEN_BUILD=1
  -D MESHCORE_VERSION='"1.17.1"'
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D UI_HAS_JOYSTICK=1
  -D UI_HAS_JOYSTICK_UPDOWN=1
  -D UI_SENSORS_PAGE=1
  -D PIN_BUZZER=12
  -D QSPIFLASH=1
  -D BLE_PIN_CODE=123456
  -D ENV_PIN_SDA=PIN_WIRE1_SDA
  -D ENV_PIN_SCL=PIN_WIRE1_SCL
  -D CARDKB_ADDRESS=0x5F
  -Os
build_src_filter =
  +<helpers/nrf52/SerialBLEInterface.cpp>
  -<helpers/DeviceDiag.cpp>
  -<helpers/sensors/EnvironmentSensorManager.cpp>
  -<helpers/ui/GxEPDDisplay.cpp>
  -<helpers/ui/MomentaryButton.cpp>
  -<helpers/ui/SH1106Display.cpp>
  -<helpers/ui/buzzer.cpp>
  -<../variants/wio-tracker-l1/target.cpp>
  +<../examples/companion_radio/zen-overlay/src>
  +<../examples/companion_radio/zen-overlay/variants/wio-tracker-l1>
  +<../examples/companion_radio/DataStore.cpp>
  +<../examples/companion_radio/zen-overlay/app/*.cpp>
  +<../examples/companion_radio/zen-overlay/app/ui-new/*.cpp>

[env:WioTrackerL1_Zen_OLED]
extends = WioTrackerL1, zen_wio_overlay
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${WioTrackerL1.build_flags}
  ${zen_wio_overlay.build_flags}
  -D DISPLAY_CLASS=ZenSH1106Display
  -D ADVERT_NAME='"@@MAC"'
build_src_filter =
  ${WioTrackerL1.build_src_filter}
  ${zen_wio_overlay.build_src_filter}
  -<../examples/companion_radio/zen-overlay/src/helpers/ui/ZenGxEPDDisplay.cpp>
lib_deps =
  ${WioTrackerL1.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
extra_scripts =
  pre:examples/companion_radio/zen-overlay/build/configure_overlay.py
  post:examples/companion_radio/zen-overlay/build/create-zen-uf2.py
custom_uf2_basename = WioTrackerL1_Zen_OLED

[env:WioTrackerL1_Zen_E-INK]
extends = WioTrackerL1Eink, zen_wio_overlay
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${WioTrackerL1Eink.build_flags}
  ${zen_wio_overlay.build_flags}
  -I lib/GxEPD2-patch/src
  -D DISPLAY_CLASS=ZenGxEPDDisplay
  -D EINK_DISPLAY_MODEL=GxEPD2_213_B74
  -D BUTTON_USE_INTERRUPTS=1
  -D AUTO_OFF_MILLIS=0
build_src_filter =
  ${WioTrackerL1Eink.build_src_filter}
  ${zen_wio_overlay.build_src_filter}
  -<../examples/companion_radio/zen-overlay/src/helpers/ui/ZenSH1106Display.cpp>
lib_deps =
  ${WioTrackerL1Eink.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
extra_scripts =
  pre:examples/companion_radio/zen-overlay/build/configure_overlay.py
  post:examples/companion_radio/zen-overlay/build/create-zen-uf2.py
custom_uf2_basename = WioTrackerL1_Zen_E-INK
