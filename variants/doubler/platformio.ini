; Isolated opt-in builds. Stock repeater environments remain unchanged.
[doubler]
version = v1.18.0-doubler.5
lib_deps = bblanchon/ArduinoJson @ ^7.4.3
build_flags =
  -D FLOOD_TEXT_DOUBLER=1
  -D FIRMWARE_VERSION='"${doubler.version}"'
  -D LORA_FREQ=916.575
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=7

[env:Xiao_nrf52_repeater_doubler]
extends = env:Xiao_nrf52_repeater
lib_deps =
  ${Xiao_nrf52.lib_deps}
  ${doubler.lib_deps}
extra_scripts =
  post:variants/doubler/configure.py
  ${nrf52_base.extra_scripts}
build_flags =
  ${env:Xiao_nrf52_repeater.build_flags}
  ${doubler.build_flags}

[env:RAK_4631_repeater_doubler]
extends = env:RAK_4631_repeater
lib_deps =
  ${rak4631.lib_deps}
  ${doubler.lib_deps}
extra_scripts =
  post:variants/doubler/configure.py
  ${rak4631.extra_scripts}
build_flags =
  ${env:RAK_4631_repeater.build_flags}
  ${doubler.build_flags}

; Exercise the real dispatcher, packet pool, RNG, and wire serialization on host.
[env:native_doubler]
platform = native
test_framework = googletest
test_filter = test_flood_text_doubler
test_build_src = yes
build_flags = -std=c++17
  -I src
  -I test/mocks
build_src_filter =
  -<*>
  +<Dispatcher.cpp>
  +<Packet.cpp>
  +<Utils.cpp>
  +<helpers/StaticPoolPacketManager.cpp>
lib_deps =
  google/googletest @ 1.17.0
  ${doubler.lib_deps}
